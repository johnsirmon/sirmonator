<!doctype html><meta charset="utf-8"><title>Four-minute synthetic storage/export resilience</title>
<h1>Four-minute synthetic storage/export resilience</h1><p>Procedural CC0 tones, not speech. Dedicated namespace; no production database, model or download.</p>
<button id="build">Build / resume 120 synthetic passages</button><button id="export">Export MP3 in memory</button><button id="verify">Verify saved text and PCM checksums</button><button id="stop">Cancel current operation</button>
<pre id="status" role="status">Opening isolated fixture…</pre>
<script type="module">
if(location.origin!=='http://127.0.0.1:4201')throw Error('Wrong fixture origin; no database opened or controls installed');
const run=new URLSearchParams(location.search).get('run');if(!/^[a-z0-9-]{1,50}$/i.test(run??''))throw Error('Use a unique synthetic run ID');
const [{openStorage},{resilienceJob,resilienceAudio},{recordingBlob,validateCheckpoint},{sha256Bytes},{mp3Duration}]=await Promise.all([import('/src/storage.js'),import('/scripts/resilience-scenario.mjs'),import('/src/job-runner.js'),import('/src/asset-integrity.js'),import('/src/mp3.js')]);
const store=await openStorage(indexedDB,'synthetic-long-browser-'+run),owner='fixture-'+crypto.randomUUID(),status=document.getElementById('status');let job=await store.ensureJob(await resilienceJob(120)),controller=null,artifact=null;
const display=value=>status.textContent=JSON.stringify(value,null,2);
async function operation(fn){if(controller)return;const active=new AbortController();controller=active;try{await fn(active.signal);}catch(error){display({error:error.message,name:error.name,saved:(await store.job(job.id)).next});}finally{controller=null;}}
document.getElementById('build').onclick=()=>operation(async signal=>{if(!await store.claim(owner))throw Error('Fixture is busy; close its other tab or retry after 20 seconds');try{job=await store.job(job.id);await validateCheckpoint(store,job,{signal});for(let i=job.next;i<120;i++){if(signal.aborted)throw new DOMException('Cancelled','AbortError');job=await store.commit(job.id,i,resilienceAudio(job,i,{sampleCount:48000}),owner);display({committed:job.next,total:120,seconds:job.seconds});}display({built:true,passages:job.next,chapters:job.chapters.length,seconds:job.seconds,pcmBytes:job.bytes,sourceHash:job.sourceHash});}finally{await store.release(owner);}});
document.getElementById('export').onclick=()=>operation(async signal=>{job=await store.job(job.id);artifact=await recordingBlob(store,job,null,undefined,{signal,onProgress:value=>display(value)});const bytes=new Uint8Array(await artifact.blob.arrayBuffer());display({exportedInMemory:true,downloadCompleted:false,passages:job.next,inputSeconds:artifact.seconds,mp3Bytes:bytes.length,frameParsedSeconds:mp3Duration(bytes),sha256:await sha256Bytes(bytes),checksumPolicy:job.settings.renderManifest.checkpointIntegrity});});
document.getElementById('verify').onclick=()=>operation(async signal=>{job=await store.job(job.id);const parts=await validateCheckpoint(store,job,{signal});display({verified:true,parts:parts.length,sourceHash:job.sourceHash,allOriginalHashes:parts.every(p=>/^[a-f0-9]{64}$/.test(p.audioHash)),seconds:job.seconds});});
document.getElementById('stop').onclick=()=>controller?.abort();window.addEventListener('pagehide',()=>{controller?.abort();store.release(owner).catch(()=>{});store.close();});display({ready:true,savedPassages:job.next,namespace:'synthetic-long-browser-'+run});
</script>
