<!doctype html><meta charset="utf-8"><title>Local ASR muted native QA</title><h1>Local ASR muted native QA</h1><p>No playback or microphone. Synthetic tone, silence and optional locally generated speech; no real-recording accuracy validation.</p><button id="seed">Seed verified cached model from ignored local downloads</button><button id="run">Run 1-second synthetic tone</button><button id="silence">Run silence</button><button id="speech">Run synthetic speech</button><button id="cancel">Cancel worker</button><pre id="out">Ready</pre><script type="module">
import {createAsrClient} from '/src/local-asr.js';import {ASR_MODEL,ASR_ROOT,verifyAsrAsset} from '/src/asr-cache.js';
const out=document.querySelector('#out'),client=createAsrClient();let history=[];
const log=v=>{history.push(v);out.textContent=JSON.stringify(history,null,2);};
document.querySelector('#seed').onclick=async()=>{try{const cache=await caches.open('sirmonator-asr-'+ASR_MODEL.revision);for(const a of ASR_MODEL.assets){const r=await fetch('/.cache/asr/'+a.path),b=await verifyAsrAsset(await r.arrayBuffer(),a);await cache.put(ASR_ROOT+a.path,new Response(b));}log({seed:'verified',bytes:ASR_MODEL.assets.reduce((n,a)=>n+a.size,0)});}catch(e){log({error:e.message});}};
async function run(silence){const samples=Float32Array.from({length:16000},(_,i)=>silence?0:.1*Math.sin(2*Math.PI*220*i/16000));try{log({started:silence?'silence':'tone'});const value=await client.run(samples,{onProgress:message=>{out.textContent=JSON.stringify(history,null,2)+'\n'+message;}});log({result:value});}catch(e){log({error:e.name+': '+e.message});}}
document.querySelector('#run').onclick=()=>run(false);document.querySelector('#silence').onclick=()=>run(true);document.querySelector('#speech').onclick=async()=>{try{const {asrPcm}=await import('/src/local-asr.js'),b=await (await fetch('/.cache/asr-synthetic.wav')).arrayBuffer(),v=new DataView(b);let n=12;while(n+8<b.byteLength){const id=String.fromCharCode(...new Uint8Array(b,n,4)),size=v.getUint32(n+4,true);if(id==='data'){const samples=asrPcm(b.slice(n+8,n+8+size),24000);log({started:'Windows synthetic speech',seconds:samples.length/16000});log({result:await client.run(samples,{onProgress:message=>out.textContent=JSON.stringify(history,null,2)+'\n'+message})});return;}n+=8+size+(size%2);}throw Error('No WAV data');}catch(e){log({error:e.message});}};
document.querySelector('#cancel').onclick=()=>client.cancel();
</script>
