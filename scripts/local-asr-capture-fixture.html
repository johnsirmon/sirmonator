<!doctype html><meta charset="utf-8"><title>ASR capture cancellation QA</title><h1>ASR capture cancellation · muted native QA</h1><p>Real native IndexedDB and Blob reads; synthetic PCM fixture. ASR worker is stubbed to count starts. No playback, microphone, model download or upload.</p><button id="prepare">Prepare held final read</button><button id="release-old">Reject old held read</button><pre id="capture-log">Ready</pre><div id="review-host"></div><script type="module">
import {openStorage} from '/src/storage.js';import {makeRecording} from '/src/recording.js';import {FOUNDATION_PIPELINE} from '/src/engine-specs.js';import {syntheticPassage} from '/scripts/integration-fixture.mjs';import {createSpeechReviewEditor} from '/src/speech-review-editor.js';
const $=id=>document.getElementById(id),log=message=>$('capture-log').textContent=message;let editor,store,heldReject,read=0,hold=false,workerRuns=0;
const markup=await (await fetch('/index.html')).text(),parsed=new DOMParser().parseFromString(markup,'text/html');$('review-host').append(parsed.getElementById('speech-review'));$('speech-review').open=true;
$('prepare').onclick=async()=>{try{store=await openStorage(indexedDB,'native-asr-cancel-'+crypto.randomUUID());let job=await makeRecording('Paul spoke with hope.',{voice:'af_sarah',edition:'refined',speed:1,delivery:'natural',pipeline:FOUNDATION_PIPELINE});await store.ensureJob(job);await store.claim('native');job=await store.commit(job.id,0,await syntheticPassage({text:job.source,settings:job.settings,last:true}),'native');
 const held=new Promise((_,reject)=>heldReject=reject);held.catch(()=>{});class HeldBlob extends Blob{async arrayBuffer(){if(hold&&++read===6){log('Final capture Blob read held. Cancel now. Worker starts: '+workerRuns);await held;}return super.arrayBuffer();}}
 const wrapped={...store,parts:async(...args)=>(await store.parts(...args)).map(p=>({...p,blob:new HeldBlob([p.blob])}))};
 editor=createSpeechReviewEditor({$,getStore:()=>wrapped,getJob:()=>job,getSelection:()=>0,isBusy:()=>false,onBusy(){if(editor)queueMicrotask(()=>{if(!editor.busy)log('Editor idle. ASR enabled: '+!$('review-asr').disabled+'; manual enabled: '+!$('review-compare').disabled+'; worker starts: '+workerRuns+'; transcript: '+$('review-transcript').value);});},onListen(){},onRepair(){},onExport(){},repository:{load:async()=>null},asrClient:{cancel(){},async run(){workerRuns++;return {transcript:'Paul spoke with hope.'};}}});await editor.update(job);$('review-transcript').value='Preserve my manual transcript';read=0;hold=true;log('Prepared. Click Download / retry local ASR to hold the final read.');}catch(e){log(e.message);}};
$('release-old').onclick=()=>{heldReject?.(Error('Late held native read failure'));log('Old held read rejected. Worker starts: '+workerRuns+'; editor busy: '+editor.busy+'; transcript: '+$('review-transcript').value);};
</script>
